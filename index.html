<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>KTJ Companion</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game-modules.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,700;1,400&display=swap">
<style>
/* Layout: Demo-Leiste oben (ausserhalb des Produkts). SIXplorer = App im Handyformat links, Hinweise zur Demo rechts.
   Führungskraft und HR = linksbündige Dashboards. Farben und Schriften angelehnt an die SIX-Folien (Rot, Navy, Hellblau, Noto). */
:root{
  --ground:#E8E9EB; --surface:#FFFFFF; --surface-2:#F3F4F6; --line:#D6D9DD;
  --ink:#15191E; --body:#3A4048; --muted:#667079;
  --brand:#DE3919; --brand-strong:#D4210D; --brand-deep:#C20B03; --brand-ink:#C8230B; --on-brand:#FFFFFF;
  --navy:#002C5F; --navy-ink:#002C5F; --on-navy:#FFFFFF;
  --sky:#88C1E4; --sky-tint:#EAF4FA; --taupe:#A39C93;
  --ok:#1F7A4D; --ok-bg:#E3F3EA; --warn:#8A5A00; --warn-bg:#FFF1D6;
  --bar:#002C5F; --on-bar:#FFFFFF; --bar-soft:#1D4676; --bar-line:#5E7EA3;
  --frame:#15191E; --knob:#FFFFFF; --scrim:rgba(8,20,38,.5); --shadow:rgba(0,24,56,.38);
  --font-ui:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-display:"Noto Serif",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0D1116; --surface:#171C22; --surface-2:#1F252C; --line:#303841;
  --ink:#F0F2F4; --body:#C7CDD4; --muted:#929BA6;
  --brand:#DE3919; --brand-strong:#D4210D; --brand-deep:#B80A02; --brand-ink:#FF8A73; --on-brand:#FFFFFF;
  --navy:#1B4A80; --navy-ink:#A9CDEE; --on-navy:#FFFFFF;
  --sky:#5FA6D3; --sky-tint:#15283A; --taupe:#8C867E;
  --ok:#6FD3A0; --ok-bg:#12301F; --warn:#F2C56B; --warn-bg:#3A2B08;
  --bar:#071B33; --on-bar:#FFFFFF; --bar-soft:#17335A; --bar-line:#4A678C;
  --frame:#2A313A; --knob:#E8ECF0; --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.6);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --ground:#0D1116; --surface:#171C22; --surface-2:#1F252C; --line:#303841;
  --ink:#F0F2F4; --body:#C7CDD4; --muted:#929BA6;
  --brand:#DE3919; --brand-strong:#D4210D; --brand-deep:#B80A02; --brand-ink:#FF8A73; --on-brand:#FFFFFF;
  --navy:#1B4A80; --navy-ink:#A9CDEE; --on-navy:#FFFFFF;
  --sky:#5FA6D3; --sky-tint:#15283A; --taupe:#8C867E;
  --ok:#6FD3A0; --ok-bg:#12301F; --warn:#F2C56B; --warn-bg:#3A2B08;
  --bar:#071B33; --on-bar:#FFFFFF; --bar-soft:#17335A; --bar-line:#4A678C;
  --frame:#2A313A; --knob:#E8ECF0; --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.6);
  color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--body);font:14px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--navy-ink);outline-offset:2px}
h1:focus{outline:none}
.ic{width:20px;height:20px;flex:none}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Demo-Leiste */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bar)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);color:var(--on-bar)}
.bar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;flex-wrap:wrap;gap:10px 22px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.brand-mark{width:28px;height:28px;border-radius:7px;background:var(--brand-strong);color:var(--on-brand);display:grid;place-items:center}
.brand small{display:block;font-weight:400;font-size:11.5px;opacity:.85}
.roles{display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--bar-soft)}
.roles button{border:0;background:transparent;color:var(--on-bar);padding:7px 12px;border-radius:6px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.roles button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--brand-strong);color:var(--on-brand);font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.bar-meta{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px}
.bar-meta button{border:1px solid var(--bar-line);background:transparent;color:var(--on-bar);border-radius:6px;padding:6px 10px;font-weight:600;font-size:12px}

/* Bühne und Handyrahmen */
.stage{max-width:1240px;margin:0 auto;padding-block:26px 44px}
.six-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:44px;align-items:start}
.phone{width:392px;height:clamp(600px,calc(100vh - 128px),830px);background:var(--frame);border-radius:38px;padding:10px;box-shadow:0 22px 44px -20px var(--shadow)}
.screen{position:relative;height:100%;background:var(--ground);border-radius:28px;overflow:hidden;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:22px}
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding-inline:4px}
.tabs button{border:0;background:none;padding:8px 0 9px;display:grid;justify-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--muted);min-width:0}
.tabs button[aria-current="page"]{color:var(--brand-ink)}
.tabs .ic{width:22px;height:22px}

/* App: Kopf, Abschnitte, Listen */
.top{background:var(--surface);border-bottom:1px solid var(--line);padding-block:14px 13px}
.top h1{font:700 22px/1.2 var(--font-display);color:var(--ink);text-wrap:balance}
.top .sub{margin-top:5px;color:var(--muted);font-size:13px}
.back{border:0;background:none;padding:0;margin:0 0 10px -4px;display:flex;align-items:center;gap:2px;font-weight:600;font-size:13px;color:var(--navy-ink)}
.logic{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:13px}
.logic span{padding-top:6px;border-top:3px solid var(--line);font-size:11.5px;font-weight:600;color:var(--muted)}
.logic span.on{border-top-color:var(--brand);color:var(--ink)}
.logic.base span{border-top-color:var(--navy-ink)}
.logic-note{margin-top:6px;font-size:12px;color:var(--muted)}
.sec{padding-top:20px}
.sec > h2{font:600 13px/1.3 var(--font-ui);color:var(--muted);margin-bottom:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.panel.in{padding:14px}
.rows > *{display:block;padding:12px 14px;border-top:1px solid var(--line)}
.rows > *:first-child{border-top:0}
button.row{width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;display:flex;align-items:center;gap:12px}
.rows > button.row:first-child{border-top:0}
.row-main{flex:1;min-width:0}
.t{font-weight:600;color:var(--ink)}
.m{color:var(--muted);font-size:12.5px;margin-top:2px}
.chev{color:var(--muted)}
.stack{display:grid;gap:10px}
.inline{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--sky-tint);color:var(--navy-ink);border-radius:10px;padding:11px 12px;font-size:12.5px}
.note .ic{width:18px;height:18px;margin-top:1px}
.quote{font:italic 400 15px/1.5 var(--font-display);color:var(--ink)}
dl.kv{display:grid;gap:12px}
dl.kv dt{font-size:12px;color:var(--muted)}
dl.kv dd{color:var(--ink);margin-top:1px}

/* Status, Buttons, Formulare */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;border:1px solid transparent;font-size:12px;font-weight:600;white-space:nowrap}
.pill .ic{width:13px;height:13px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.info{background:var(--sky-tint);color:var(--navy-ink)}
.pill.neutral{background:var(--surface-2);border-color:var(--line);color:var(--body)}
.pill.open{border:1px dashed var(--muted);color:var(--body)}
.pill.solid{background:var(--navy);color:var(--on-navy)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 14px;border-radius:6px;border:1px solid transparent;font-weight:600;font-size:14px;text-align:center}
.btn.primary{background:var(--brand-strong);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-deep)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.block{width:100%}
.btn.small{min-height:34px;padding:5px 10px;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
label.f,.f{display:block;margin:16px 0 6px;font-weight:600;font-size:13px;color:var(--ink)}
form > .f:first-child{margin-top:0}
textarea,select,input[type="text"]{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
textarea{min-height:86px;resize:vertical;display:block}
.hint{margin-top:6px;font-size:12.5px;color:var(--muted)}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale label{position:relative;display:block}
.scale input{position:absolute;inset:0;opacity:0;margin:0}
.scale span{display:grid;place-items:center;height:40px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:600;color:var(--ink)}
.scale input:checked + span{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.scale input:focus-visible + span{outline:2px solid var(--navy-ink);outline-offset:2px}
.scale-ends{display:flex;justify-content:space-between;margin-top:4px;font-size:12px;color:var(--muted)}
.switch{display:flex;gap:12px;align-items:flex-start;margin-top:18px}
.switch input{appearance:none;-webkit-appearance:none;flex:none;width:42px;height:24px;margin:0;border-radius:12px;background:var(--muted);position:relative;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--knob);transition:transform .15s}
.switch input:checked{background:var(--navy)}
.switch input:checked::after{transform:translateX(18px)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.seg button{min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-weight:600;font-size:13px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--body)}
.chips button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}

/* Journey-Start */
.hero{background:var(--brand-strong);color:var(--on-brand);padding-block:16px 48px}
.hero .hi{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.hero h1{font:700 27px/1.15 var(--font-display);margin-top:12px}
.hero p{font:italic 400 14.5px/1.4 var(--font-display);margin-top:3px}
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;flex:none;background:var(--surface);color:var(--ink);font-size:12px;font-weight:700}
.av.sm{width:26px;height:26px;font-size:10.5px;background:var(--surface-2);border:1px solid var(--line)}
.lift{margin-top:-32px;position:relative}
.track{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px}
.track i{height:12px;border-radius:2px;opacity:.3}
.track i.done{opacity:1}
.track i.now{opacity:1;outline:2px solid var(--ink);outline-offset:2px}
.c0{background:var(--navy-ink)} .c1{background:var(--sky)} .c2{background:var(--taupe)} .c3{background:var(--brand)}
.track-ends{display:flex;justify-content:space-between;margin-top:7px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.linkbtn{border:0;background:none;padding:0;font-weight:600;font-size:13px;color:var(--navy-ink);text-decoration:underline;text-underline-offset:3px}
.num{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;border:1.5px solid var(--brand);color:var(--brand-ink);font-weight:700;font-size:13px}
.base-row{background:var(--sky-tint);border-radius:0 0 11px 11px}
.tl li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.dot{width:12px;height:12px;border-radius:50%;margin-top:4px;border:2px solid var(--muted)}
.dot.done{background:var(--muted)}
.dot.now{border-color:var(--brand);background:var(--brand)}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.figs b{display:block;font-size:20px;font-weight:600;color:var(--ink)}
.figs span{font-size:11.5px;color:var(--muted);line-height:1.3;display:block}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.steps li{padding-top:7px;border-top:3px solid var(--line);font-size:11.5px;color:var(--muted);font-weight:600}
.steps li.done{border-top-color:var(--muted)}
.steps li.now{border-top-color:var(--brand);color:var(--ink)}
.struck{text-decoration:line-through;text-decoration-color:var(--muted)}

/* Sheet und Toast */
.sheet-wrap{position:absolute;inset:0;z-index:25;background:var(--scrim);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;padding-block:16px 20px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.sheet h2{font:700 19px/1.25 var(--font-display);color:var(--ink)}
.x{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:min(92vw,460px);background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:8px;font-weight:600;font-size:13.5px;box-shadow:0 10px 30px -10px var(--shadow)}

/* Hinweise zur Demo (nur breit) */
.guide{max-width:540px;padding-top:6px}
.guide h2{font:700 30px/1.15 var(--font-display);color:var(--ink);text-wrap:balance}
.guide .inline{margin:12px 0 14px}
.guide p{font-size:15px;line-height:1.55;max-width:58ch}
.guide h3{font:600 14px/1.3 var(--font-ui);color:var(--ink);margin:22px 0 8px}
.guide ol{counter-reset:g;display:grid;gap:8px}
.guide ol li{counter-increment:g;display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;font-size:14.5px;line-height:1.5}
.guide ol li::before{content:counter(g);font-weight:700;color:var(--brand-ink)}
.guide .foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

/* Dashboards */
.dash-head{margin-bottom:22px}
.dash-head h1{font:700 30px/1.15 var(--font-display);color:var(--ink);text-wrap:balance}
.dash-head p{margin-top:6px;font-size:15px;max-width:70ch}
.dash{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}
.col{display:grid;gap:22px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.card > h2{font:600 16px/1.3 var(--font-ui);color:var(--ink);margin-bottom:4px}
.card > .m{margin-bottom:10px}
.q{padding:14px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.person{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px}
.person[aria-pressed="true"]{border-color:var(--navy-ink);box-shadow:inset 0 0 0 1px var(--navy-ink)}
.lrow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 14px;padding:11px 0;border-top:1px solid var(--line)}
.lrow:first-of-type{border-top:0}
.lrow .k{font-weight:600;color:var(--ink)}
.feed li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.feed li:first-child{border-top:0}
.feed time{color:var(--muted);font-variant-numeric:tabular-nums}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:11px 14px;font-weight:600;font-size:13.5px;margin-bottom:22px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-bottom:22px;align-items:start}
.tile{padding:13px 0;border-top:1px solid var(--line)}
.tile:first-of-type{border-top:0}
.tile .lab{font-size:13px;color:var(--body)}
.tile .val{font-size:26px;font-weight:600;color:var(--ink);line-height:1.2;margin-top:2px}
.tile .val small{font-size:14px;font-weight:500;color:var(--muted)}
.tile .val.later{font-size:14px;font-weight:500;color:var(--muted);line-height:1.45;margin-top:4px}
.tile .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.hyp{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.meters{display:grid;gap:0}
.meter{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 84px 108px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.meter:first-child{border-top:0}
.mbar{height:8px;border-radius:4px;background:var(--sky-tint);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:4px;background:var(--navy-ink)}
.meter .fig{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;text-align:right}

@media (max-width:1020px){ .kpis{grid-template-columns:1fr} .dash{grid-template-columns:1fr} }
@media (max-width:899px){
  .bar-in{gap:10px} .brand{order:1;flex:1;min-width:0} .bar-meta{order:2;flex:none} .roles{order:3;width:100%} .roles button{flex:1;justify-content:center;padding:7px 6px}
  .stage.is-six{padding:0;max-width:none}
  .stage:not(.is-six){padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .six-wrap{display:block}
  .guide{display:none}
  .phone{width:auto;height:auto;background:none;border-radius:0;padding:0;box-shadow:none}
  .screen{border-radius:0;overflow:visible;display:block;min-height:70vh}
  .scroll{overflow:visible;padding-bottom:96px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
  .sheet-wrap{position:fixed;z-index:50}
  .sheet{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}

.ring{position:relative;width:68px;height:68px;flex:none}
.ring svg{width:100%;height:100%;display:block}
.ring-bg{fill:none;stroke:var(--on-brand);stroke-opacity:.28;stroke-width:6}

.ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:var(--on-brand)}

.datebox{width:44px;flex:none;border-radius:8px;background:var(--sky-tint);color:var(--navy-ink);display:grid;justify-items:center;padding:6px 0;line-height:1.1}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.stat b{font-size:22px;font-weight:600;color:var(--ink);line-height:1.15}

.dirc-a{display:inline-flex;align-items:center;gap:2px;margin-top:12px;font-weight:600;font-size:13px}

.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

.f0{font-weight:600;font-size:13px;color:var(--ink);margin-bottom:8px}
.evi{width:32px;height:32px;flex:none;border-radius:8px;background:var(--sky-tint);color:var(--navy-ink);display:grid;place-items:center;align-self:flex-start}

  ['Dana','HR','Kap. 2: Diversität in Organisationen','Stereotype und Diskriminierung','Pauschale Annahmen über Gruppen führen zu ungleicher Behandlung und müssen hinterfragt werden','Diversität umfasst sichtbare Merkmale wie Alter oder Geschlecht und tiefe Merkmale wie Werte. Stereotype sind vereinfachte Annahmen über Gruppen. Sie werden zu Diskriminierung, wenn sie Entscheidungen steuern.','Im Recruiting fällt auf, dass Bewerbende mit Lücke im Lebenslauf automatisch aussortiert werden.','Was tust du?',['Das Kriterium auf Stereotype prüfen und nach den Anforderungen der Stelle entscheiden','Nichts, das ist bewährt','Nur noch Bewerbende ohne Lücken einladen'],0,'Entscheide anhand von Fähigkeiten und Aufgabe. Pauschale Kriterien verstecken oft Stereotype.'],
  ['Ana','Support','Kap. 3: Einstellungen und Arbeitszufriedenheit','Reaktionen auf Unzufriedenheit','Kündigen, ansprechen, loyal abwarten oder vernachlässigen: vier Antworten auf Unzufriedenheit','Zufriedenheit und Engagement beeinflussen Leistung, Fehlzeiten und Kündigungen. Unzufriedene reagieren mit Exit (kündigen), Voice (ansprechen), Loyalty (abwarten) oder Neglect (nachlässig werden).','Seit der Umstrukturierung macht Ana nur noch Dienst nach Vorschrift und kommt öfter zu spät.','Welche Reaktion zeigt Ana, und was hilft?',['Voice: Sie redet viel und ist zufrieden','Neglect: Sie zieht sich zurück. Ein offenes Gespräch lädt zu Voice ein','Exit: Sie hat bereits gekündigt'],1,'Neglect ist passiv und schädlich. Zuhören und Probleme ansprechen verschiebt es Richtung Voice.'],
  ['Lea','Kundenservice','Kap. 4: Emotionen und Stimmungen','Emotionsarbeit','Gefühle zeigen, die die Rolle verlangt, entweder gespielt (Surface) oder tief erlebt (Deep)','Beim Surface Acting spielt man Gefühle nur, beim Deep Acting verändert man das eigene Empfinden. Dauerhaftes Surface Acting erschöpft. Emotionale Intelligenz hilft, Gefühle bei sich und anderen zu erkennen und zu steuern.','Lea lächelt am Telefon, obwohl sie innerlich genervt ist, weil die Rolle es verlangt.','Was beschreibt das, und was ist das Risiko?',['Deep Acting: gar kein Risiko','Emotionale Intelligenz: senkt Stress automatisch','Surface Acting: auf Dauer kann es erschöpfen'],2,'Gespielte Gefühle kosten Energie. Pausen, Austausch und ein Perspektivwechsel (Deep Acting) entlasten.'],
  ['Sven','Risk','Kap. 5: Persönlichkeit und Werte','Big Five','Fünf Persönlichkeitsdimensionen, von denen Gewissenhaftigkeit die Leistung am besten vorhersagt','Die Big Five sind Extraversion, Verträglichkeit, Gewissenhaftigkeit, emotionale Stabilität und Offenheit. Gewissenhaftigkeit hängt über viele Berufe hinweg am stärksten mit guter Leistung zusammen. Wichtig ist auch der Fit zu Job und Organisation.','Du besetzt eine Stelle, die viel Selbstorganisation und Genauigkeit verlangt.','Welches Merkmal gewichtest du besonders?',['Extraversion','Offenheit für Erfahrungen','Gewissenhaftigkeit'],2,'Gewissenhaftigkeit steht für Organisation, Zuverlässigkeit und Genauigkeit und passt hier am besten.'],
  ['Raj','Product','Kap. 6: Wahrnehmung und Entscheiden','Entscheidungsfehler','Typische Denkfehler wie Bestätigungs- und Überschätzungsfehler verzerren Entscheidungen','Wahrnehmung ist subjektiv, etwa durch Stereotype und Attributionsfehler. Entscheidungen verzerren Überschätzung, Bestätigungsfehler, Verfügbarkeitsfehler und Rückschaufehler. Gegenmittel: Annahmen prüfen und Gegenargumente suchen.','Nach der Entscheidung sucht Raj nur noch Argumente, die seine Idee stützen.','Welcher Denkfehler liegt vor?',['Rückschaufehler','Bestätigungsfehler','Verfügbarkeitsfehler'],1,'Beim Bestätigungsfehler beachtet man nur, was die eigene Sicht stützt. Suche gezielt nach Gegenbelegen.'],
  ['Eva','Marketing','Kap. 7: Motivationskonzepte','Zielsetzungstheorie','Konkrete, herausfordernde Ziele mit Feedback steigern die Leistung','Motivation erklärt Richtung, Intensität und Ausdauer von Anstrengung. Nach der Zielsetzungstheorie wirken konkrete, akzeptierte Ziele besser als «gib dein Bestes», besonders mit Feedback. Andere Theorien betonen Bedürfnisse, Fairness und Erwartungen.','Eva hat nur das Ziel «Gib dein Bestes» bekommen und arbeitet unruhig.','Wie formulierst du das Ziel besser?',['Bis Freitag 20 Anfragen bearbeiten, am Mittwoch besprechen wir den Zwischenstand','Dabei bleiben, sie schafft das schon','Das Ziel offen lassen, damit sie frei ist'],0,'Konkret, herausfordernd und mit Rückmeldung: Das ist, was die Zielsetzungstheorie als wirksam beschreibt.'],
  ['Ben','Operations','Kap. 8: Motivation in der Praxis','Job Characteristics Model','Fünf Kernmerkmale machen Arbeit motivierend: Vielfalt, Ganzheit, Bedeutung, Autonomie, Feedback','Das Modell nennt Anforderungsvielfalt, Ganzheitlichkeit, Bedeutsamkeit, Autonomie und Rückmeldung. Mehr davon führt zu sinnvoll erlebter Arbeit und höherer Motivation. Job Enrichment und Mitbestimmung setzen genau dort an.','Ben erledigt täglich nur einen Teilschritt und sieht nie, was daraus wird.','Wie gestaltest du die Stelle um?',['Mehr Kontrolle einführen','Ganze Aufgabenpakete mit Autonomie und Rückmeldung zur Wirkung geben','Das Tempo erhöhen'],1,'Ganzheit, Bedeutung und Feedback fehlen hier. Sie lassen sich durch Job Enrichment ergänzen.'],
  ['Mara','Platform','Kap. 9: Gruppenverhalten','Gruppenentwicklung','Forming, Storming, Norming, Performing, Adjourning: Gruppen durchlaufen typische Phasen','Gruppen entwickeln sich über Forming (Kennenlernen), Storming (Konflikte um Rollen), Norming (Zusammenhalt), Performing (Leistung) und Adjourning (Abschluss). Rollen und Normen steuern Verhalten, Gruppendruck kann zu Groupthink führen.','Ein neues Projektteam streitet in Woche eins über Rollen und Zuständigkeiten.','In welcher Phase ist das Team?',['Norming','Performing','Storming'],2,'Streit um Rollen und Führung ist typisch für Storming. Klare Rollen helfen, die Phase zu überwinden.'],
  ['Oli','Data','Kap. 10: Arbeitsteams','Team-Effektivität','Kontext, Zusammensetzung und Prozesse entscheiden, ob Teams erfolgreich sind','Teams haben gemeinsame Verantwortung und sich ergänzende Fähigkeiten. Wirksam sind sie mit passendem Kontext (Ressourcen, Führung), passender Zusammensetzung (Fähigkeiten, Grösse) und guten Prozessen (gemeinsamer Plan, Vertrauen). In zu grossen Teams entsteht soziales Faulenzen.','Dein Team hat 15 Personen, die Abstimmung ist schwach und manche tragen kaum bei.','Was tust du?',['In kleinere Teams mit klarer Verantwortung aufteilen','Einen weiteren Meetingtag einführen','Nichts, Teams regeln das selbst'],0,'Mit wachsender Grösse sinkt der Einzelbeitrag (soziales Faulenzen). Kleinere Teams stärken Verantwortung.'],
  ['Nora','Legal','Kap. 11: Kommunikation','Kommunikationsprozess','Sender kodiert, Empfänger dekodiert, und Feedback prüft, ob die Botschaft ankam','Kommunikation besteht aus Sender, Botschaft, Kanal, Empfänger und Feedback. Filtern, Emotionen oder Sprache verzerren Botschaften. Reiche Kanäle wie das persönliche Gespräch eignen sich für komplexe Themen.','Du erklärst Nora per Mail eine komplexe Aufgabe. Sie antwortet nur mit «ok».','Wie stellst du das Verständnis sicher?',['Nichts, ok heisst verstanden','Nora in eigenen Worten zusammenfassen lassen, am besten im kurzen Gespräch','Dieselbe Mail nochmal schicken'],1,'Feedback schliesst den Kreis der Kommunikation. Zusammenfassen zeigt, was wirklich angekommen ist.'],
  ['Pia','IT','Kap. 12: Führung','Transformationale Führung','Inspiriert durch Vision und individuelle Förderung über Eigeninteressen hinaus','Transaktionale Führung tauscht Leistung gegen Belohnung, transformationale motiviert durch Vision, Vorbild und individuelle Förderung. Situative Theorien betonen, dass der Stil zur Lage passen muss. Vertrauen ist die Grundlage.','Dein Team steht vor einem grossen Wandel und braucht Orientierung und Energie.','Welcher Ansatz passt am besten?',['Nur Belohnung für erledigte Aufgaben','Jede Aufgabe eng kontrollieren','Eine Vision vermitteln, Einzelne fördern und selbst Vorbild sein'],2,'Im Wandel braucht ein Team Sinn und Förderung. Genau das leistet transformationale Führung.'],
  ['Luca','Compliance','Kap. 13: Macht und Politik','Machtgrundlagen','Formale Macht (Zwang, Belohnung, Legitimation) und persönliche Macht (Expertise, Ausstrahlung)','Macht ist die Fähigkeit, das Verhalten anderer zu beeinflussen. Persönliche Macht durch Expertise und Ausstrahlung wirkt meist stärker als formale. Einfluss entsteht auch durch Taktiken wie rationale Argumente und Koalitionen.','Du führst ein Projekt mit Leuten aus anderen Abteilungen, ohne Weisungsbefugnis.','Worauf stützt du deinen Einfluss?',['Auf Expertise und Vertrauen, dazu klare Argumente','Auf Drohungen mit Konsequenzen','Auf eine Position, die du nicht hast'],0,'Ohne formale Macht tragen Expertise, Vertrauen und überzeugende Argumente.'],
  ['Yara','Sales','Kap. 14: Konflikt und Verhandlung','Integratives Verhandeln','Interessen klären und Win-win-Lösungen suchen, statt um einen festen Kuchen zu feilschen','Konflikte können Aufgaben, Beziehungen oder Prozesse betreffen. Aufgabenkonflikte können nützlich sein, Beziehungskonflikte meist nicht. Distributives Verhandeln teilt einen festen Kuchen, integratives sucht Lösungen für beide Seiten.','Zwei Abteilungen streiten um dasselbe Budget und fordern je den ganzen Betrag.','Was ist der integrative Weg?',['Beide fordern das Maximum und feilschen hart','Ein Teil gibt nach, damit Ruhe herrscht','Interessen klären und Lösungen suchen, bei denen beide etwas gewinnen'],2,'Hinter Forderungen stehen Interessen. Wer sie kennt, findet oft Lösungen jenseits des festen Kuchens.'],
  ['Finn','Strategy','Kap. 15: Organisationsstruktur','Mechanistisch und organisch','Starre, zentrale Strukturen für Stabilität, flexible, dezentrale für unsichere Umfelder','Struktur wird beschrieben durch Spezialisierung, Abteilungsbildung, Weisungskette, Kontrollspanne, Zentralisierung und Formalisierung. Mechanistische Strukturen sind streng und zentral, organische flexibel und dezentral. Die beste Form hängt vom Umfeld ab.','Dein Bereich arbeitet in einem schnell wechselnden Markt, doch jede Entscheidung braucht fünf Freigaben.','Wie passt du die Struktur an?',['Mehr Regeln und Freigaben einführen','Entscheidungen dezentralisieren und die Formalisierung senken','Die Spezialisierung weiter erhöhen'],1,'Unsichere Umfelder verlangen schnelle Entscheide: eher organisch, dezentral und weniger formalisiert.'],
  ['Sofia','People & Culture','Kap. 16: Organisationskultur','Organisationskultur','Gemeinsame Werte und Annahmen, die durch Auswahl, Vorbilder und Einarbeitung weiterleben','Kultur ist das gemeinsame Verständnis davon, was hier gilt. Sie wird durch Auswahl, das Vorbild der Führung und Sozialisation aufrechterhalten. Starke Kulturen stärken Zusammenhalt, können aber Vielfalt und Wandel bremsen.','Neue Mitarbeitende verletzen ungeschriebene Regeln im Team.','Was hilft am meisten?',['Werte und Normen vorleben und in der Einarbeitung erklären','Sie bei Verstössen bestrafen','Die Regeln ändern, ohne darüber zu sprechen'],0,'Kultur wird durch Vorbild und Sozialisation weitergegeben. Erkläre und lebe, was gilt.'],
  ['Nils','Transformation','Kap. 17: Wandel und Stressmanagement','Lewins Drei-Phasen-Modell','Auftauen, verändern, einfrieren: Wandel braucht Vorbereitung und Verankerung','Nach Lewin taut man den Status quo auf (Dringlichkeit schaffen), führt die Veränderung durch und verankert den neuen Zustand. Widerstand ist normal und sinkt durch Kommunikation und Beteiligung. Wandel erzeugt auch Stress, der Gegenmassnahmen braucht.','Du führst ein neues Tool ein. Das Team wehrt sich und fällt in alte Gewohnheiten zurück.','Wo hat es am ehesten gehakt?',['Beim Tool, es war einfach schlecht','Beim Auftauen und Verankern: Dringlichkeit und neue Routinen fehlten','Beim Team, es ist halt veränderungsresistent'],1,'Ohne Auftauen fehlt die Dringlichkeit, ohne Einfrieren bleiben neue Routinen nicht bestehen.']
];
